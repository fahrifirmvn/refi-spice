<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pilih email</title>
  <style>
    :root {
      color: #273142;
      font-family: Roboto, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #fff;
    }

    body {
      display: grid;
      place-items: center;
    }

    main {
      max-width: 20rem;
      padding: 2rem;
      text-align: center;
    }

    .mark {
      display: grid;
      width: 3.5rem;
      height: 3.5rem;
      margin: 0 auto 1rem;
      place-items: center;
      border-radius: 50%;
      background: #e8f0fe;
      color: #0b57d0;
      font-size: 1.4rem;
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    p {
      margin: 0.5rem 0 0;
      color: #6b7280;
      font-size: 0.9rem;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✉</div>
    <h1>Pilih email untuk membacanya</h1>
    <p>Pesan yang dipilih akan tampil di sini.</p>
  </main>
</body>
</html>
